<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0d9488" />

    <!-- Preload the first hero slide so the largest paint starts immediately -->
    <link
      rel="preload"
      as="image"
      href="/img/health-check-1600.webp"
      imagesrcset="/img/health-check-800.webp 800w, /img/health-check-1600.webp 1600w"
      imagesizes="(min-width: 768px) 620px, 92vw"
      fetchpriority="high"
    />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO Meta -->
    <title>Clinique HealthTree | Multispeciality Clinic & Diagnostics</title>
    <meta
      name="description"
      content="Clinique HealthTree – Multispeciality clinic & diagnostics in AECS Layout, Singasandra, Bangalore. Expert doctors, lab tests, pharmacy, ultrasound, cardiology & preventive healthcare."
    />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://cliniquehealthtree.com/" />

    <!-- Open Graph (WhatsApp / LinkedIn / Facebook) -->
    <meta property="og:title" content="Clinique HealthTree" />
    <meta
      property="og:description"
      content="Multispeciality Clinic & Diagnostics in Singasandra, Bangalore"
    />
    <meta
      property="og:image"
      content="https://cliniquehealthtree.com/og-image.jpg"
    />
    <meta property="og:url" content="https://cliniquehealthtree.com" />
    <meta property="og:type" content="website" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Clinique HealthTree" />
    <meta
      name="twitter:description"
      content="Multispeciality Clinic & Diagnostics – Singasandra, Bangalore"
    />
    <meta
      name="twitter:image"
      content="https://cliniquehealthtree.com/og-image.jpg"
    />

    <!-- 🟢 Medical Organization Schema (CRITICAL for Google Name) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MedicalOrganization",
        "name": "Clinique HealthTree",
        "alternateName": "Clinique Health Tree",
        "url": "https://cliniquehealthtree.com",
        "logo": "https://cliniquehealthtree.com/logo.png",
        "telephone": "+918073718255",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "AECS Layout, Singasandra",
          "addressLocality": "Bangalore",
          "addressRegion": "KA",
          "postalCode": "560068",
          "addressCountry": "IN"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": [
              "Monday",
              "Tuesday",
              "Wednesday",
              "Thursday",
              "Friday",
              "Saturday"
            ],
            "opens": "07:00",
            "closes": "22:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Sunday",
            "opens": "07:00",
            "closes": "13:00"
          }
        ],
        "email": "healthtreeclinique@gmail.com",
        "image": "https://cliniquehealthtree.com/og-image.jpg",
        "sameAs": [
          "https://www.practo.com/bangalore/clinic/clinique-health-tree",
          "https://www.facebook.com/share/17wtmYgner/",
          "https://www.instagram.com/healthtreeclinique"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
